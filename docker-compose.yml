version: '3.9'

services:
  postgres:
    image: postgres:15-alpine
    container_name: meeting_intelligence_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-meetinguser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-meetingpassword}
      POSTGRES_DB: ${POSTGRES_DB:-meeting_intelligence}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - '5432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-meetinguser} -d ${POSTGRES_DB:-meeting_intelligence}']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - meeting_network

  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: meeting_intelligence_app
    restart: unless-stopped
    ports:
      - '${PORT:-3000}:3000'
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-meetinguser}:${POSTGRES_PASSWORD:-meetingpassword}@postgres:5432/${POSTGRES_DB:-meeting_intelligence}
      NODE_ENV: ${NODE_ENV:-production}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ['CMD-SHELL', 'node -e "const http = require(\"http\"); http.get(\"http://localhost:3000/health\", (r) => r.statusCode === 200 ? process.exit(0) : process.exit(1)).on(\"error\", () => process.exit(1))"']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    volumes:
      - app_logs:/app/logs
    networks:
      - meeting_network

volumes:
  postgres_data:
    driver: local
  app_logs:
    driver: local

networks:
  meeting_network:
    driver: bridge
